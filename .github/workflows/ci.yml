name: ci
on:
  push:
    branches: ['main', 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        python: ['3.11', '3.12']
        node: ['20']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # version-pin test needs history for ancestry check
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install
        run: pip install pytest
      - name: Pytest (unit/integration/e2e/regression/adversarial)
        run: pytest -q -p no:cacheprovider
      - name: Legacy parity bench (mbpp mini)
        run: |
          PYTHONPATH=. python bench/mbpp_mini.py > mbpp.json || true
          python -c "
          import json
          raw = open('mbpp.json').read()
          d = json.loads(raw[:raw.index(chr(10)+'}'+chr(10))+3])
          print('mbpp-mini:', d['passed'], '/', d['total'], 'syntax:', d['syntax_ok'])
          bad = [r for r in d['results'] if not r['pass'] and not r['id'].startswith('STRETCH')]
          assert not bad, bad
          "
      - name: Capability bench (10 levels)
        run: |
          PYTHONPATH=. PYTHONPATH=.:bench python bench/capability.py > cap.json
          python -c "
          import json
          d = json.load(open('cap.json'))
          print('capability:', d['totals']['passed'], '/', d['totals']['total'])
          assert d['totals']['passed'] == d['totals']['total'], [ (r['id'], r['name'], r['details']) for r in d['levels'] if not r['tests_ok'] ]
          "
      - name: CLI smoke
        run: |
          PYTHONPATH=. python -m epsilon single "function add(a, b) returns sum"
          PYTHONPATH=. python -m epsilon generate "Todo CLI with JSON storage" --out "$RUNNER_TEMP/epsmoke" --max-iterations 2 | python -c "import json,sys; d=json.load(sys.stdin); print('smoke:', d['state']); assert d['state'] in ('PASS','UNKNOWN'), d['state']"
      - name: Language matrix (28 render targets)
        if: matrix.python == '3.12'
        run: |
          PYTHONPATH=. python bench/lang_matrix.py > langs.json
          python -c "
          import json
          d = json.load(open('langs.json'))
          print('langs rendered:', d['rendered'], '/', d['total'])
          # render refusals with documented gaps (e.g. haskell statements)
          # are expected; only real FAILs break the build.
          bad = [r for r in d['results'] if r['verify'] == 'FAIL']
          assert not bad, bad
          refused = [r for r in d['results'] if not r['render_ok']]
          assert all('support' in (r.get('note') or '') for r in refused), refused
          assert d['rendered'] >= 27, d['rendered']
          "
      - name: SWE-mini repair bench (harness health)
        if: matrix.python == '3.12'
        run: |
          PYTHONPATH=.:bench python bench/swe_mini.py > swe.json || true
          python -c "
          import json
          d = json.load(open('swe.json'))
          print('swe-mini resolved:', d['resolved'], '/', d['total'])
          assert d['total'] == 8, d['total']
          bad = [r for r in d['results'] if r['category'].startswith('infra-') or r['category'] == 'contaminated']
          assert not bad, bad
          "
